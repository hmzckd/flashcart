services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: flashcart
      POSTGRES_USER: flashcart
      POSTGRES_PASSWORD: flashcart
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"

  notification-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    ports:
      - "5434:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  notification-postgres-data: