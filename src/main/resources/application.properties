spring.application.name=flashcart

spring.datasource.url=jdbc:postgresql://localhost:5433/flashcart
spring.datasource.username=flashcart
spring.datasource.password=flashcart

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

flashcart.stock-locking=pessimistic
flashcart.order-retry.max-retries=3

flashcart.payment.signing-secret=${PAYMENT_SIGNING_SECRET}
flashcart.payment.provider-url=${PAYMENT_PROVIDER_URL}
flashcart.payment.api-key=${PAYMENT_API_KEY}
flashcart.payment.provider-timeout=5s
flashcart.payment.deadline=15m

flashcart.scheduling.enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=250ms
spring.cache.redis.time-to-live=5s

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[request.timeout.ms]=4000
spring.kafka.producer.properties[delivery.timeout.ms]=5000
